services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-https://paperless.bangkhan.com}
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PAPERLESS_API_URL=http://paperless-ngx:8000/api
      - PAPERLESS_API_TOKEN=${PAPERLESS_TOKEN}
      - PAPERLESS_USERNAME=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_PASSWORD=${PAPERLESS_ADMIN_PASSWORD:-password}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
      - paperless-ngx
    networks:
      - app-network

  db:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - gotenberg
      - tika
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
      - ./scripts:/usr/src/paperless/scripts
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBENGINE=mariadb
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBUSER=${DB_USER}
      - PAPERLESS_DBPASS=${DB_PASSWORD}
      - PAPERLESS_DBNAME=${DB_NAME}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=https://paperlessngx.bangkhan.com
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=https://paperlessngx.bangkhan.com,https://paperless.bangkhan.com
      - PAPERLESS_ALLOWED_HOSTS=paperlessngx.bangkhan.com,paperless.bangkhan.com,localhost,paperless-ngx
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - USERMAP_UID=1000
      - USERMAP_GID=1000
      - PAPERLESS_POST_CONSUME_SCRIPT=/usr/src/paperless/scripts/post-consume.py
      - PAPERLESS_CONSUMER_RECURSIVE=true
      - PAPERLESS_CONSUMER_POLLING=10
      - PAPERLESS_API_TOKEN=${PAPERLESS_TOKEN}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD:-password}
    networks:
      - app-network

  redis:
    image: redis:7
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    command:
      - "gotenberg"
      - "--chromium-disable-routes=true"
    networks:
      - app-network

  tika:
    image: apache/tika:latest
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:
  redis_data:
